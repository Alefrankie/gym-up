name: Release

on:
  push:
    branches: [main]
    # Decision records (including their generated index.md and graph.json) never change what ships.
    paths-ignore:
      - 'decisions/**'

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.checkout.outputs.sha }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      app_changed: ${{ steps.plan.outputs.app_changed }}

    steps:
      - name: Check out all commits and release tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record the commit every job releases
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test release publication safeguards
        run: node --test scripts/release-git.test.mjs

      - name: Compute the next version and whether the app changed
        id: plan
        run: node scripts/release.mjs plan

  api:
    name: Deploy API
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets}"
          node scripts/release.mjs api "${{ needs.plan.outputs.version }}"

  app:
    name: Deploy web app and Android APK
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.app_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_BUILD_TOOLS_VERSION: '37.0.0'

    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies and build state
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # A per-run key so every release saves its build state; restore-keys pick the
      # newest one. A fixed key hits forever and never refreshes the cached target dir.
      - name: Cache Rust dependencies and build state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            apps/app/src-tauri/target
          key: rust-android-${{ hashFiles('apps/app/src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-android-${{ hashFiles('apps/app/src-tauri/Cargo.lock') }}-
            rust-android-

      - name: Install cargo-ndk
        shell: bash
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Configure the existing Android release signing key
        shell: bash
        env:
          GYM_UP_ANDROID_KEYSTORE_BASE64: ${{ secrets.GYM_UP_ANDROID_KEYSTORE_BASE64 }}
          GYM_UP_ANDROID_STORE_PASSWORD: ${{ secrets.GYM_UP_ANDROID_STORE_PASSWORD }}
          GYM_UP_ANDROID_KEY_PASSWORD: ${{ secrets.GYM_UP_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GYM_UP_ANDROID_KEYSTORE_BASE64:?Add GYM_UP_ANDROID_KEYSTORE_BASE64 to GitHub Actions secrets}"
          : "${GYM_UP_ANDROID_STORE_PASSWORD:?Add GYM_UP_ANDROID_STORE_PASSWORD to GitHub Actions secrets}"
          : "${GYM_UP_ANDROID_KEY_PASSWORD:?Add GYM_UP_ANDROID_KEY_PASSWORD to GitHub Actions secrets}"
          signing_dir="$HOME/.gym-up/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$GYM_UP_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/gym-up-release.jks"
          cat > "$signing_dir/keystore.properties" <<EOF
          storeFile=$signing_dir/gym-up-release.jks
          storePassword=$GYM_UP_ANDROID_STORE_PASSWORD
          keyAlias=gym-up-release
          keyPassword=$GYM_UP_ANDROID_KEY_PASSWORD
          EOF
          chmod 600 "$signing_dir/gym-up-release.jks" "$signing_dir/keystore.properties"

      - name: Build the APK and deploy the web app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets}"
          node scripts/release.mjs app "${{ needs.plan.outputs.version }}"

  publish:
    name: Tag and push the release
    needs: [plan, api, app]
    # Publish only when the API deployed and the app either deployed or had nothing to deploy.
    if: ${{ !cancelled() && needs.api.result == 'success' && (needs.app.result == 'success' || needs.app.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the planned commit and release tags
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C main

      - name: Commit the version, tag, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          credential_helper="$(mktemp)"
          cat > "$credential_helper" <<'EOF'
          #!/bin/sh
          printf 'username=x-access-token\n'
          printf 'password=%s\n' "$GH_TOKEN"
          EOF
          chmod 700 "$credential_helper"
          git config --local credential.helper "$credential_helper"
          trap 'git config --local --unset-all credential.helper || true; rm -f "$credential_helper"' EXIT
          node scripts/release.mjs publish "${{ needs.plan.outputs.version }}"
