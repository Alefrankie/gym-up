name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Deploy API, web app, and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GYM_UP_ANDROID_KEYSTORE_BASE64: ${{ secrets.GYM_UP_ANDROID_KEYSTORE_BASE64 }}
      GYM_UP_ANDROID_STORE_PASSWORD: ${{ secrets.GYM_UP_ANDROID_STORE_PASSWORD }}
      GYM_UP_ANDROID_KEY_PASSWORD: ${{ secrets.GYM_UP_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out all commits and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure the existing Android release signing key
        shell: bash
        run: |
          set -euo pipefail
          : "${GYM_UP_ANDROID_KEYSTORE_BASE64:?Add GYM_UP_ANDROID_KEYSTORE_BASE64 to GitHub Actions secrets}"
          : "${GYM_UP_ANDROID_STORE_PASSWORD:?Add GYM_UP_ANDROID_STORE_PASSWORD to GitHub Actions secrets}"
          : "${GYM_UP_ANDROID_KEY_PASSWORD:?Add GYM_UP_ANDROID_KEY_PASSWORD to GitHub Actions secrets}"
          signing_dir="$HOME/.gym-up/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$GYM_UP_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/gym-up-release.jks"
          cat > "$signing_dir/keystore.properties" <<EOF
          storeFile=$signing_dir/gym-up-release.jks
          storePassword=$GYM_UP_ANDROID_STORE_PASSWORD
          keyAlias=gym-up-release
          keyPassword=$GYM_UP_ANDROID_KEY_PASSWORD
          EOF
          chmod 600 "$signing_dir/gym-up-release.jks" "$signing_dir/keystore.properties"

      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets}"

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, deploy, tag, and push release
        run: pnpm release
