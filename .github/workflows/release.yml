name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Deploy API, web app, and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_BUILD_TOOLS_VERSION: '37.0.0'

    steps:
      - name: Check out all commits and release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies and build state
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> apps/app/src-tauri/target

      - name: Install cargo-ndk
        shell: bash
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Configure the existing Android release signing key
        shell: bash
        env:
          GYM_UP_ANDROID_KEYSTORE_BASE64: ${{ secrets.GYM_UP_ANDROID_KEYSTORE_BASE64 }}
          GYM_UP_ANDROID_STORE_PASSWORD: ${{ secrets.GYM_UP_ANDROID_STORE_PASSWORD }}
          GYM_UP_ANDROID_KEY_PASSWORD: ${{ secrets.GYM_UP_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GYM_UP_ANDROID_KEYSTORE_BASE64:?Add GYM_UP_ANDROID_KEYSTORE_BASE64 to GitHub Actions secrets}"
          : "${GYM_UP_ANDROID_STORE_PASSWORD:?Add GYM_UP_ANDROID_STORE_PASSWORD to GitHub Actions secrets}"
          : "${GYM_UP_ANDROID_KEY_PASSWORD:?Add GYM_UP_ANDROID_KEY_PASSWORD to GitHub Actions secrets}"
          signing_dir="$HOME/.gym-up/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$GYM_UP_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/gym-up-release.jks"
          cat > "$signing_dir/keystore.properties" <<EOF
          storeFile=$signing_dir/gym-up-release.jks
          storePassword=$GYM_UP_ANDROID_STORE_PASSWORD
          keyAlias=gym-up-release
          keyPassword=$GYM_UP_ANDROID_KEY_PASSWORD
          EOF
          chmod 600 "$signing_dir/gym-up-release.jks" "$signing_dir/keystore.properties"

      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets}"

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, deploy, tag, and push release
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          credential_helper="$(mktemp)"
          cat > "$credential_helper" <<'EOF'
          #!/bin/sh
          printf 'username=x-access-token\n'
          printf 'password=%s\n' "$GH_TOKEN"
          EOF
          chmod 700 "$credential_helper"
          git config --local credential.helper "$credential_helper"
          trap 'git config --local --unset-all credential.helper || true; rm -f "$credential_helper"' EXIT
          pnpm release
