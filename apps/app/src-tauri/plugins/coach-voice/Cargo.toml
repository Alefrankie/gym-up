[package]
name = "tauri-plugin-coach-voice"
version = "0.1.0"
authors = [ "Gym Up" ]
description = "Android text-to-speech with a male voice for the Gym Up Coach"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-coach-voice"

[dependencies]
tauri = { version = "2.12.5" }
serde = "1.0"
thiserror = "2"
serde_json = "1.0"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
